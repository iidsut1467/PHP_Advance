<DOCTYPE html!>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport">
    <link rel="stylesheet" href="PHP_Advance/PHP_CSS">
    <link rel="stylesheet" href="PHP_Advance/PHP">
    <title>掲示板アプリ</title>
</head>

    
<body>
    <h1>掲示板アプリ</h1>
    <p>掲示板だヨ！！</p>
    // idをつかって表示を切り替えたいがこれをCSSでするのかPHPでするのか
    // ログイン、ユーザー追加、ユーザー編集、記事投稿画面、コメント画面の5つのリンクを表示してそのページに飛ばすかあるいは他を隠したまま飛ばす
    // 
    <div class="insert" id = "logIn">
     <a>ログイン</a>
     <input class = "email"><input>
     <input class = "password"></input>
     // inputで入力させるようにする、PHPで情報をサーバーに送る
    </div>

    <div class = "insert" id = "plusUser">
     <a>ユーザー追加</a>
     <imput class = "email"></imput>
     <input class = "first_name"></input>
     <input class = "last_name"></input>
     <imput class = "password"></imput>
    </div>

    <div class = "insert" id = "editUser">
     <a>ユーザー編集</a>
     <imput class = "email"></imput>
     <input class = "first_name"></input>
     <input class = "last_name"></input>
     <imput class = "password"></imput>
    </div>

    <div class = "insert" id = "contents">
     <a>記事投稿画面</a>
     <input class = ""></input>
     <imput class = "password"></imput>
    </div>
    
    <div class = "insert" id = "coments">
     <a>コメント画面</a>
     <input class = ""></input>
     <imput class = "password"></imput>
    </div>

    <div class = "changeWindow">
        <a id = "1">ログイン</a>
        <a id = "2">ユーザー追加</a>
        <a id = "3">ユーザー編集</a>
        <a id = "4">記事投稿</a>
        <a id = "5">コメント画面</a>
    </div>


</body>
</html>
